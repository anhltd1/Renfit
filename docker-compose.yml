services:
  mongo:
    image: mongo:7
    container_name: renfit-mongo
    command:
      - "mongod"
      - "--bind_ip_all"
      - "--quiet"
    logging:
      driver: "none"
    expose:
      - "27017"
    # Uncomment to access MongoDB from the host (for debugging with Compass, etc.)
    # ports:
    #   - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: renfit-backend
    # No host port mapping (U9 Deployment hardening) — the backend is only
    # reachable from the frontend/Caddy container over the compose-internal
    # network (see Caddyfile's reverse_proxy). Uncomment the line below if
    # you need to reach the API directly from the host for local debugging.
    # ports:
    #   - "8000:8000"
    expose:
      - "8000"
    volumes:
      - ./backend/env/.env:/app/env/.env:ro
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # Override MONGODB_URI to use the local mongo container
      MONGODB_URI: "mongodb://mongo:27017/renfit"
      DB_NAME: "renfit"
      # Docker runs the production build (Caddy + built SPA). Plain local
      # `uvicorn --reload` dev keeps API_ENV from backend/env/.env.
      API_ENV: "${API_ENV:-production}"
      # Set CORS_ORIGINS in the root .env to your HTTPS domain. Defaults are
      # local dev origins only. (The SPA and API share one origin through
      # Caddy, so an ngrok tunnel to Caddy needs no CORS entry.)
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: renfit-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Consumed by the Caddyfile (Caddy substitutes {$DOMAIN} at start) —
      # must be a real, DNS-resolving domain for automatic Let's Encrypt TLS.
      # Defaults to ":80" (plain HTTP, no cert management) for local Docker
      # testing — do NOT default this to "localhost"; Caddy treats any
      # hostname as a real domain needing HTTPS, which breaks startup
      # without a proper CA trust-store setup in the container.
      DOMAIN: "${DOMAIN:-:80}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  # Persists MongoDB data across container restarts/rebuilds.
  # To do a full reset: docker compose -f docker-compose.reset.yml up -d
  mongo_data:
  # Persists Caddy's issued TLS certificates across container restarts/
  # rebuilds so it doesn't re-request a new one from Let's Encrypt every time.
  caddy_data:
  caddy_config:
